<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Feham</title>
  <style>
    @font-face {
      font-family: 'Feham Nastaliq';
      src: url('fonts/NotoNastaliqUrdu.woff2') format('woff2');
      font-display: swap;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      width: 290px;
      font: 13px/1.5 -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      color: #1e293b;
      background: #ffffff;
    }

    .header {
      text-align: center;
      padding: 10px 20px 16px;
      background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
      color: #fff;
    }

    /* Nastaliq glyphs sit well above and below the em box, so this needs a
       generous line-height or the title gets clipped by the top of the popup. */
    .header h1 {
      font-family: 'Feham Nastaliq', 'Noto Nastaliq Urdu', serif;
      font-size: 30px;
      font-weight: 400;
      line-height: 2.6;
      direction: rtl;
    }

    .header p { font-size: 11px; color: #fef3c7; }

    .content { padding: 16px; display: grid; gap: 10px; }

    .row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 12px 14px;
      border: 1px solid #e2e8f0;
      border-radius: 10px;
    }

    .row .label { font-weight: 600; }
    .row .hint { display: block; font-weight: 400; font-size: 11px; color: #64748b; margin-top: 2px; }

    .switch {
      position: relative;
      flex: 0 0 auto;
      width: 44px;
      height: 24px;
      border: 0;
      border-radius: 12px;
      background: #cbd5e1;
      cursor: pointer;
      transition: background .2s ease;
    }
    .switch[aria-checked="true"] { background: #10b981; }
    .switch::after {
      content: '';
      position: absolute;
      top: 3px;
      left: 3px;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: #fff;
      box-shadow: 0 1px 3px rgba(0,0,0,.3);
      transition: transform .2s ease;
    }
    .switch[aria-checked="true"]::after { transform: translateX(20px); }
    .switch:focus-visible { outline: 2px solid #b45309; outline-offset: 2px; }

    .keys {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 10px;
      padding: 12px 14px;
      font-size: 11px;
      color: #475569;
      display: grid;
      gap: 5px;
    }
    .keys div { display: flex; justify-content: space-between; gap: 10px; }
    kbd {
      font: 600 10px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace;
      background: #fff;
      border: 1px solid #cbd5e1;
      border-bottom-width: 2px;
      border-radius: 4px;
      padding: 1px 5px;
    }

    .footer { padding: 0 16px 16px; }
    .link {
      display: block;
      width: 100%;
      padding: 8px;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      background: #fff;
      font: inherit;
      font-size: 11px;
      color: #64748b;
      cursor: pointer;
    }
    .link:hover { background: #f8fafc; color: #334155; }
  </style>
</head>
<body>
  <div class="header">
    <h1>فہم</h1>
    <p>Hover-to-read Urdu</p>
  </div>

  <div class="content">
    <div class="row">
      <span class="label">Enabled
        <span class="hint">Works on the pages you already have open</span>
      </span>
      <button class="switch" id="enabled" role="switch" aria-checked="true" aria-label="Enable Feham"></button>
    </div>

    <div class="row">
      <span class="label">Hold <kbd>Shift</kbd> to look up
        <span class="hint">Stops tooltips appearing as you read</span>
      </span>
      <button class="switch" id="requireShift" role="switch" aria-checked="false" aria-label="Require Shift key"></button>
    </div>

    <div class="keys">
      <div><span>Copy the Urdu word</span> <kbd>C</kbd></div>
      <div><span>Full dictionary entry</span> <kbd>K</kbd></div>
      <div><span>Dismiss</span> <kbd>Esc</kbd></div>
    </div>
  </div>

  <div class="footer">
    <button class="link" id="clearCache">Clear cached translations</button>
  </div>

  <script src="popup.js"></script>
</body>
</html>
